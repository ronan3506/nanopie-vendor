<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nano Pie Vendor App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              main: 'var(--bg-main)',
              card: 'var(--bg-card)',
              primary: 'var(--primary)',
              foreground: 'var(--foreground)',
              secondary: 'var(--secondary)',
              success: 'var(--success)',
              muted: 'var(--muted)',
              border: 'var(--border)'
            }
          }
        }
      }
    </script>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="device-wrapper">
        <div class="device-home-bar"></div>
        
        <!-- Persistent Header -->
        <div id="app-header-container"></div>
        
        <!-- Screen Content Container -->
        <div class="device-screen-container">
            <div id="app" class="screen-stack"></div>
        </div>
        
        <!-- Persistent Bottom Navigation -->
        <div id="app-nav-container"></div>
    </div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const d = document.createElement('div');
        d.style = "position:absolute;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-size:16px;width:100%;";
        d.innerHTML = 'ERROR: ' + msg + '<br>Line: ' + lineNo;
        document.body.appendChild(d);
        return false;
      };
    </script>
    <script src="app.js"></script>
</body>
</html>
